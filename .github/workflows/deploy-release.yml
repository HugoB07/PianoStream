name: Build, Publish and Release

on:
  push:
    tags:
      - 'v*'  # Ex: v1.0.0

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # Adapte selon ta version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Create publish profile file
      run: |
        mkdir -p Properties/PublishProfiles
        echo "${{ secrets.PUBLISH_PROFILE }}" > PianoStream/Properties/PublishProfiles/MonProfil.pubxml
      shell: bash

    - name: Publish using publish profile
      run: |
        dotnet publish -c Release -p:PublishProfile=PianoStream/Properties/PublishProfiles/MonProfil.pubxml

    - name: Archive published output
      run: |
        mkdir publish-artifact
        cp -r bin/Release/net*/publish/* publish-artifact/
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: published-output
        path: publish-artifact

  create-release:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
    - name: Download published artifact
      uses: actions/download-artifact@v4
      with:
        name: published-output
        path: output

    - name: Create zip file
      run: zip -r release.zip output

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}